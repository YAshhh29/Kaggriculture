<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="836" viewBox="0 0 1280 836" role="img" aria-labelledby="t d" class="viz">
  <title id="t">Architecture of the final agent</title>
  <desc id="d">Thirteen layers wrap an open-source route-following base: four guards, four market layers, three farm layers and three opponent-modelling layers, outermost first.</desc>

  <style>
    .viz { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .surface { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .axis { stroke: #c3c2b7; stroke-width: 1; }
    .ring { stroke: rgba(11,11,11,0.10); stroke-width: 1; fill: none; }
    .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; }
    .t1 { fill: #e8f1fc; } .t2 { fill: #fdeee7; } .t3 { fill: #e6f6f0; } .t4 { fill: #fdf3dc; }
    .ctx { fill: #c3c2b7; }
    .panel { fill: #f3f2ee; }
    .arrow { stroke: #898781; stroke-width: 2; fill: none; }
    .arrowhead { fill: #898781; }
    .gold { fill: #b07d10; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .ring { stroke: rgba(255,255,255,0.10); }
      .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; }
      .t1 { fill: #1c2a3c; } .t2 { fill: #3a241b; } .t3 { fill: #17302a; } .t4 { fill: #352c17; }
      .ctx { fill: #5d5c58; }
      .panel { fill: #242423; }
      .gold { fill: #e0b04a; }
    }
  </style>
  <rect class="surface" x="0" y="0" width="1280" height="836" rx="12"/>
  <rect class="ring" x="0.5" y="0.5" width="1279" height="835" rx="12"/>
  <text x="24" y="40" class="ink" font-size="20" font-weight="700" text-anchor="start">How the final agent (N11) decides each turn</text>
  <text x="24" y="62" class="ink2" font-size="14" font-weight="400" text-anchor="start">Each layer wraps the one below it: the observation travels down, the base proposes an action, and every layer may adjust it on the way back up</text>
  <rect class="s1" x="24" y="78" width="14" height="14" rx="3"/>
  <text x="44" y="90" class="ink2" font-size="13" font-weight="400" text-anchor="start">Market</text>
  <rect class="s2" x="106" y="78" width="14" height="14" rx="3"/>
  <text x="126" y="90" class="ink2" font-size="13" font-weight="400" text-anchor="start">Guard</text>
  <rect class="s3" x="180" y="78" width="14" height="14" rx="3"/>
  <text x="200" y="90" class="ink2" font-size="13" font-weight="400" text-anchor="start">Farm</text>
  <rect class="s4" x="246" y="78" width="14" height="14" rx="3"/>
  <text x="266" y="90" class="ink2" font-size="13" font-weight="400" text-anchor="start">Opponent model</text>
  <path class="arrow" d="M80 116 V758"/>
  <path class="arrowhead" d="M72 756 l8 14 l8 -14 z"/>
  <text x="68" y="437.0" class="muted" font-size="13" font-weight="400" text-anchor="middle" transform="rotate(-90 68 437.0)">observation in</text>
  <path class="arrow" d="M1210 758 V126"/>
  <path class="arrowhead" d="M1202 128 l8 -14 l8 14 z"/>
  <text x="1228" y="437.0" class="muted" font-size="13" font-weight="400" text-anchor="middle" transform="rotate(90 1228 437.0)">action out</text>
  <rect class="t2" x="150" y="112" width="1010" height="40" rx="8"/>
  <rect class="s2" x="150" y="112" width="6" height="40" rx="3"/>
  <text x="170" y="138" class="ink" font-size="15" font-weight="700" text-anchor="start">safety</text>
  <text x="350" y="138" class="ink2" font-size="14" font-weight="400" text-anchor="start">Never crashes: repairs malformed actions and keeps a 60-second time budget</text>
  <text x="1146" y="138" class="muted" font-size="13" font-weight="600" text-anchor="end">L</text>
  <rect class="t4" x="150" y="158" width="1010" height="40" rx="8"/>
  <rect class="s4" x="150" y="158" width="6" height="40" rx="3"/>
  <text x="170" y="184" class="ink" font-size="15" font-weight="700" text-anchor="start">own_book</text>
  <text x="350" y="184" class="ink2" font-size="14" font-weight="400" text-anchor="start">Tells the base engine what we really sold, so it stops reading our sales as the rival's</text>
  <text x="1146" y="184" class="muted" font-size="13" font-weight="600" text-anchor="end">N11</text>
  <rect class="t2" x="150" y="204" width="1010" height="40" rx="8"/>
  <rect class="s2" x="150" y="204" width="6" height="40" rx="3"/>
  <text x="170" y="230" class="ink" font-size="15" font-weight="700" text-anchor="start">shed_guard</text>
  <text x="350" y="230" class="ink2" font-size="14" font-weight="400" text-anchor="start">Sells or cancels purchases so the day-end shed overflow destroys nothing</text>
  <text x="1146" y="230" class="muted" font-size="13" font-weight="600" text-anchor="end">N10</text>
  <rect class="t2" x="150" y="250" width="1010" height="40" rx="8"/>
  <rect class="s2" x="150" y="250" width="6" height="40" rx="3"/>
  <text x="170" y="276" class="ink" font-size="15" font-weight="700" text-anchor="start">place_guard</text>
  <text x="350" y="276" class="ink2" font-size="14" font-weight="400" text-anchor="start">Builds the pen first when an animal is about to be placed on bare ground</text>
  <text x="1146" y="276" class="muted" font-size="13" font-weight="600" text-anchor="end">N7</text>
  <rect class="t1" x="150" y="296" width="1010" height="40" rx="8"/>
  <rect class="s1" x="150" y="296" width="6" height="40" rx="3"/>
  <text x="170" y="322" class="ink" font-size="15" font-weight="700" text-anchor="start">draw_last</text>
  <text x="350" y="322" class="ink2" font-size="14" font-weight="400" text-anchor="start">Orders the town-draw wheat purchase around riders who copy it</text>
  <text x="1146" y="322" class="muted" font-size="13" font-weight="600" text-anchor="end">N4</text>
  <rect class="t3" x="150" y="342" width="1010" height="40" rx="8"/>
  <rect class="s3" x="150" y="342" width="6" height="40" rx="3"/>
  <text x="170" y="368" class="ink" font-size="15" font-weight="700" text-anchor="start">tomato_annex</text>
  <text x="350" y="368" class="ink2" font-size="14" font-weight="400" text-anchor="start">Plants a gated five-tile tomato annex when the town is short of tomatoes</text>
  <text x="1146" y="368" class="muted" font-size="13" font-weight="600" text-anchor="end">N3</text>
  <rect class="t4" x="150" y="388" width="1010" height="40" rx="8"/>
  <rect class="s4" x="150" y="388" width="6" height="40" rx="3"/>
  <text x="170" y="414" class="ink" font-size="15" font-weight="700" text-anchor="start">m_sell</text>
  <text x="350" y="414" class="ink2" font-size="14" font-weight="400" text-anchor="start">Learns the rival's selling clock during the game and sells just before it</text>
  <text x="1146" y="414" class="muted" font-size="13" font-weight="600" text-anchor="end">M</text>
  <rect class="t4" x="150" y="434" width="1010" height="40" rx="8"/>
  <rect class="s4" x="150" y="434" width="6" height="40" rx="3"/>
  <text x="170" y="460" class="ink" font-size="15" font-weight="700" text-anchor="start">l2_shadow</text>
  <text x="350" y="460" class="ink2" font-size="14" font-weight="400" text-anchor="start">Runs 18 public programs in lockstep; when one matches the rival, front-runs its sales</text>
  <text x="1146" y="460" class="muted" font-size="13" font-weight="600" text-anchor="end">L3</text>
  <rect class="t3" x="150" y="480" width="1010" height="40" rx="8"/>
  <rect class="s3" x="150" y="480" width="6" height="40" rx="3"/>
  <text x="170" y="506" class="ink" font-size="15" font-weight="700" text-anchor="start">l2_labour</text>
  <text x="350" y="506" class="ink2" font-size="14" font-weight="400" text-anchor="start">Gives idle hands useful work on the tile they are already standing on</text>
  <text x="1146" y="506" class="muted" font-size="13" font-weight="600" text-anchor="end">L2</text>
  <rect class="t1" x="150" y="526" width="1010" height="40" rx="8"/>
  <rect class="s1" x="150" y="526" width="6" height="40" rx="3"/>
  <text x="170" y="552" class="ink" font-size="15" font-weight="700" text-anchor="start">market_front</text>
  <text x="350" y="552" class="ink2" font-size="14" font-weight="400" text-anchor="start">Puts the orders with the most price damage into the earliest market slots</text>
  <text x="1146" y="552" class="muted" font-size="13" font-weight="600" text-anchor="end">L</text>
  <rect class="t1" x="150" y="572" width="1010" height="40" rx="8"/>
  <rect class="s1" x="150" y="572" width="6" height="40" rx="3"/>
  <text x="170" y="598" class="ink" font-size="15" font-weight="700" text-anchor="start">l2_outfarm (lot)</text>
  <text x="350" y="598" class="ink2" font-size="14" font-weight="400" text-anchor="start">Sells a whole lot at once when racing the rival for the same product</text>
  <text x="1146" y="598" class="muted" font-size="13" font-weight="600" text-anchor="end">L2</text>
  <rect class="t1" x="150" y="618" width="1010" height="40" rx="8"/>
  <rect class="s1" x="150" y="618" width="6" height="40" rx="3"/>
  <text x="170" y="644" class="ink" font-size="15" font-weight="700" text-anchor="start">l2_wheat_rt</text>
  <text x="350" y="644" class="ink2" font-size="14" font-weight="400" text-anchor="start">Buys wheat just before the town eats it and sells it back a turn later</text>
  <text x="1146" y="644" class="muted" font-size="13" font-weight="600" text-anchor="end">L2</text>
  <rect class="t3" x="150" y="664" width="1010" height="40" rx="8"/>
  <rect class="s3" x="150" y="664" width="6" height="40" rx="3"/>
  <text x="170" y="690" class="ink" font-size="15" font-weight="700" text-anchor="start">l2_animals</text>
  <text x="350" y="690" class="ink2" font-size="14" font-weight="400" text-anchor="start">Drops feeds that provably earn nothing</text>
  <text x="1146" y="690" class="muted" font-size="13" font-weight="600" text-anchor="end">L2</text>
  <rect class="panel" x="150" y="718" width="1010" height="96" rx="10"/>
  <rect class="ring" x="150.5" y="718.5" width="1009" height="95" rx="10" stroke-dasharray="6 5"/>
  <text x="170" y="750" class="ink" font-size="16" font-weight="700" text-anchor="start">Base engine: an open-source route follower (Apache-2.0)</text>
  <text x="170" y="774" class="ink2" font-size="14" font-weight="400" text-anchor="start">It follows one of 41 recorded 30-day routes, chosen on day 6 from the town's first two shops, and switches to</text>
  <text x="170" y="796" class="ink2" font-size="14" font-weight="400" text-anchor="start">a shared end-game route on day 27. Every adjustment above this box is one of the thirteen layers.</text>

</svg>
